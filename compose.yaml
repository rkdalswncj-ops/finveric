# 로컬 시연: docker compose up --build
# 개발도 이 컨테이너로 한다. 소스(apps, packages, scripts)를 마운트하므로
# 웹은 저장하면 바로 반영되고 API는 저장할 때 다시 시작한다. 의존성을 바꿨을 때만 다시 빌드한다.
# 웹 http://localhost:5173/ (판매사 콘솔 /client/ · 감독기관 /auditor/ · 증권사 앱 예시 /channel/) · API http://localhost:3001/api/health
services:
  finveric:
    build: .
    # 이 컴퓨터에서만 접속한다. Anvil의 테스트 RPC를 외부에 열지 않는다.
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:5173:5173"
    volumes:
      # 소스를 마운트한다. 코드를 고치면 다시 빌드하지 않아도 반영된다.
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      # 원장 상태·배포 설정·판매 기록, 증명 키, 컨트랙트 빌드를 재시작 뒤에도 유지한다.
      - local:/app/.local
      - circuits:/app/circuits/build
      - contracts-out:/app/out
      - contracts-cache:/app/cache
    # /api/health가 RPC·원장·저장소를 점검한다. 첫 실행은 키 생성과 배포로 몇 분 걸린다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 300s
    init: true
    # 개발 서버(API, 웹) 하나가 끝나면 scripts/dev.ts가 전체를 끝낸다. 그때 컨테이너를 다시 시작한다.
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  local:
  circuits:
  contracts-out:
  contracts-cache:
