# 로컬 시연: docker compose up --build
# client http://localhost:5173 · auditor http://localhost:5174/auditor/ · API http://localhost:3001/api/health
services:
  finveric:
    build: .
    # 이 컴퓨터에서만 접속한다. Anvil의 테스트 RPC를 외부에 열지 않는다.
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5174:5174"
    volumes:
      # 원장 상태·배포 설정·판매 기록, 증명 키, 컨트랙트 빌드를 재시작 뒤에도 유지한다.
      - local:/app/.local
      - circuits:/app/circuits/build
      - contracts-out:/app/out
      - contracts-cache:/app/cache
    init: true
    stop_grace_period: 15s

volumes:
  local:
  circuits:
  contracts-out:
  contracts-cache:
