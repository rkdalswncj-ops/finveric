    <text x="930" y="204" font-size="15" font-weight="700" fill="#191F28">GitHub</text>
    <text x="930" y="222" font-size="12" fill="#8B95A1">push하면 빌드 · 배포</text>

    <rect x="898" y="268" width="64" height="64" rx="16" fill="#FDECEA" stroke="#F5C2BD"/>
    <g fill="none" stroke="#DC382D" stroke-width="2">
      <ellipse cx="930" cy="290" rx="16" ry="5"/>
      <path d="M914 290 V310 A16 5 0 0 0 946 310 V290"/>
      <path d="M914 300 A16 5 0 0 0 946 300"/>
