    <text x="110" y="402" font-size="14" font-weight="700" fill="#191F28">소비자보호 담당</text>
    <text x="110" y="419" font-size="12" fill="#8B95A1">판매사 직원</text>

    <circle cx="110" cy="512" r="28" fill="#EAF6EF" stroke="#B7DEC8"/>
    <g fill="none" stroke="#116149" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M94 506 L110 496 L126 506 Z"/>
      <path d="M100 509 V522 M106.7 509 V522 M113.3 509 V522 M120 509 V522"/>
      <path d="M93 526 H127"/>
    </g>
    <text x="110" y="564" font-size="14" font-weight="700" fill="#191F28">감독기관</text>
    <text x="110" y="581" font-size="12" fill="#8B95A1">검사 · 분쟁조정</text>
  </g>

  <g transform="translate(60 0)">
  <!-- 웹 -->
  <g text-anchor="middle">
    <rect x="358" y="318" width="64" height="64" rx="16" fill="#EEF4FF" stroke="#C7D7FE"/>
    <g fill="none" stroke="#2563EB" stroke-width="2">
      <rect x="372" y="336" width="36" height="28" rx="4"/>
      <path d="M372 344 H408"/>
    </g>
    <circle cx="377" cy="340" r="1.3" fill="#2563EB"/>
    <circle cx="381" cy="340" r="1.3" fill="#2563EB"/>
    <circle cx="385" cy="340" r="1.3" fill="#2563EB"/>
    <text x="390" y="404" font-size="15" font-weight="700" fill="#191F28">웹</text>
    <text x="390" y="422" font-size="12" fill="#8B95A1">React · Vite</text>
    <text x="390" y="440" font-size="12" fill="#8B95A1">판매사 콘솔 · 감독기관 화면</text>
  </g>

  <!-- API -->
  <g text-anchor="middle">
    <rect x="588" y="318" width="64" height="64" rx="16" fill="#EEF4FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="620" y="358" font-size="22" font-weight="700" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#2563EB">{ }</text>
    <text x="620" y="404" font-size="15" font-weight="700" fill="#191F28">API</text>
    <text x="620" y="422" font-size="12" fill="#8B95A1">Fastify · Vercel 함수</text>
    <text x="620" y="440" font-size="12" fill="#8B95A1">ZKP 증명 · 원장 기록</text>
  </g>

  </g>

  <!-- 외부 서비스 -->
  <g text-anchor="middle" transform="translate(110 0)">
    <rect x="898" y="118" width="64" height="64" rx="16" fill="#24292F"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <circle cx="922" cy="136" r="3.5"/>
      <circle cx="922" cy="164" r="3.5"/>
      <circle cx="940" cy="144" r="3.5"/>
