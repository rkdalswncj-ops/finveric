<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, 'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4E5968"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#116149"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="24" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="24" fill="none" stroke="#E5E8EB"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#191F28">FINVERIC 서비스 아키텍처</text>
  <text x="40" y="78" font-size="14" fill="#4E5968">외부 시연 배포 기준</text>

  <g transform="translate(60 0)">
  <!-- Vercel -->
  <rect x="246" y="124" width="516" height="336" rx="18" fill="#F4F6FA" stroke="#D9DEE7"/>
  <text x="266" y="154" font-size="15" font-weight="700" fill="#191F28">▲ Vercel</text>
  <text x="266" y="174" font-size="12" fill="#8B95A1">프로젝트 하나 · 웹과 API가 같은 도메인</text>

  </g>

  <!-- 사용자 -->
  <g text-anchor="middle">
    <rect x="82" y="192" width="56" height="56" rx="14" fill="#F2F4F6" stroke="#D9DEE7"/>
    <g fill="none" stroke="#4E5968" stroke-width="2">
      <rect x="95" y="206" width="30" height="11" rx="3"/>
      <rect x="95" y="223" width="30" height="11" rx="3"/>
    </g>
    <circle cx="101" cy="211.5" r="1.6" fill="#4E5968"/>
    <circle cx="101" cy="228.5" r="1.6" fill="#4E5968"/>
    <text x="110" y="272" font-size="14" font-weight="700" fill="#191F28">증권사 앱 서버</text>
    <text x="110" y="289" font-size="12" fill="#8B95A1">판매사 시스템</text>

    <circle cx="110" cy="350" r="28" fill="#F2F4F6" stroke="#D9DEE7"/>
    <g fill="none" stroke="#4E5968" stroke-width="2.2" stroke-linecap="round">
      <circle cx="110" cy="342" r="7"/>
      <path d="M97 364 C97 353 123 353 123 364"/>
