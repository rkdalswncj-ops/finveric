    <text x="930" y="372" font-size="12" fill="#8B95A1">판매 기록</text>

    <rect x="898" y="468" width="64" height="64" rx="16" fill="#EEF0FD" stroke="#C9D0F8"/>
    <path d="M930 480 L942 501 L930 508 L918 501 Z" fill="#627EEA"/>
    <path d="M930 511 L942 504 L930 521 L918 504 Z" fill="#8A9EF0"/>
    <text x="930" y="554" font-size="15" font-weight="700" fill="#191F28">Ethereum Sepolia</text>
    <text x="930" y="572" font-size="12" fill="#8B95A1">판매 단계 원장 · ZKP 검증</text>
  </g>

  <!-- 연결 -->
  <g font-size="11" text-anchor="middle" stroke-linejoin="round">
    <path d="M140 220 H680 V316" fill="none" stroke="#4E5968" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="223" y="212" fill="#4E5968">API 키</text>

    <path d="M140 350 H416" fill="none" stroke="#4E5968" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="223" y="342" fill="#4E5968">접근 코드</text>

    <path d="M484 350 H646" fill="none" stroke="#4E5968" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="565" y="342" fill="#4E5968">HTTPS</text>

    <path d="M714 350 H930 V300 H1006" fill="none" stroke="#4E5968" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="968" y="292" fill="#4E5968">REST</text>
    <path d="M714 350 H930 V488 H1006" fill="none" stroke="#4E5968" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="968" y="480" fill="#4E5968">거래 · 조회</text>

    <path d="M1006 150 H824" fill="none" stroke="#4E5968" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="915" y="142" fill="#4E5968">빌드 · 배포</text>

    <path d="M140 512 H1006" fill="none" stroke="#116149" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
    <text x="573" y="503" font-size="12" font-weight="600" fill="#116149">원장 직접 조회 · 판매사 API를 거치지 않는다</text>
  </g>

  <text x="40" y="628" font-size="12" fill="#8B95A1">로컬에서는 Docker 컨테이너 하나가 같은 구성을 실행한다. 원장은 Anvil, 판매 기록은 파일에 둔다.</text>
</svg>
