<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="530" viewBox="0 0 1220 530" font-family="-apple-system, 'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B95A1"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#116149"/>
    </marker>
  </defs>

  <rect width="1220" height="530" rx="24" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1219" height="529" rx="24" fill="none" stroke="#E5E8EB"/>
  <text x="38" y="52" font-size="22" font-weight="700" fill="#191F28">가입과 검증 흐름</text>
  <text x="38" y="78" font-size="14" fill="#4E5968">판매 단계마다 원장에 기록한다. 앞 단계 기록이 없거나 조건이 빠지면 원장이 다음 단계를 거절한다.</text>

  <!-- 1 -->
  <g transform="translate(38 100)">
    <rect width="174" height="268" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="28" cy="30" r="14" fill="#2563EB"/><text x="28" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="50" y="35" font-size="12" font-weight="700" fill="#4E5968">판매사</text>
    <text x="16" y="74" font-size="16" font-weight="700" fill="#191F28">진단 기준·상품 등록</text>
    <text x="16" y="100" font-size="13" fill="#4E5968">기준과 상품을 버전으로</text>
    <text x="16" y="119" font-size="13" fill="#4E5968">원장에 등록한다</text>
    <text x="16" y="138" font-size="13" fill="#4E5968">원문은 이벤트에 남는다</text>
    <text x="16" y="157" font-size="13" fill="#4E5968">등록한 버전은</text>
    <text x="16" y="176" font-size="13" fill="#4E5968">고칠 수 없다</text>
    <text x="16" y="200" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#8B95A1">registerRule</text>
    <text x="16" y="215" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#8B95A1">registerProduct</text>
    <rect x="16" y="230" width="80" height="26" rx="13" fill="#EEF4FF"/><text x="56" y="247" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">원장 거래</text>
  </g>
  <!-- 2 -->
  <g transform="translate(232 100)">
    <rect width="174" height="268" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="28" cy="30" r="14" fill="#2563EB"/><text x="28" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="50" y="35" font-size="12" font-weight="700" fill="#4E5968">고객 · 판매 채널</text>
    <text x="16" y="74" font-size="16" font-weight="700" fill="#191F28">회차별 진단</text>
    <text x="16" y="100" font-size="13" fill="#4E5968">회차마다 Groth16 증명을</text>
    <text x="16" y="119" font-size="13" fill="#4E5968">만들어 원장에 기록한다</text>
    <text x="16" y="138" font-size="13" fill="#4E5968">회차는 고객 가명 ID로</text>
    <text x="16" y="157" font-size="13" fill="#4E5968">세고, 중단해도 남는다</text>
    <text x="16" y="176" font-size="13" fill="#4E5968">답변·총점은 올리지 않는다</text>
    <text x="16" y="200" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#8B95A1">recordDiagnosis</text>
    <rect x="16" y="230" width="80" height="26" rx="13" fill="#EEF4FF"/><text x="56" y="247" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">원장 거래</text>
  </g>
  <!-- 3 -->
  <g transform="translate(426 100)">
    <rect width="174" height="268" rx="14" fill="#FFFFFF" stroke="#E5E8EB"/>
    <circle cx="28" cy="30" r="14" fill="#2563EB"/><text x="28" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="50" y="35" font-size="12" font-weight="700" fill="#4E5968">소비자보호 담당</text>
    <text x="16" y="74" font-size="16" font-weight="700" fill="#191F28">관리자 승인</text>
    <text x="16" y="100" font-size="13" fill="#4E5968">3회차부터 청약 전에</text>
    <text x="16" y="119" font-size="13" fill="#4E5968">회차 이력을 보고</text>
    <text x="16" y="138" font-size="13" fill="#4E5968">승인한다</text>
    <text x="16" y="157" font-size="13" fill="#4E5968">별도 키로 서명한다</text>
    <text x="16" y="176" font-size="13" fill="#4E5968">서명은 청약 거래에 담긴다</text>
    <rect x="16" y="230" width="80" height="26" rx="13" fill="#F2F4F6"/><text x="56" y="247" font-size="12" font-weight="700" fill="#4E5968" text-anchor="middle">거래 없음</text>
  </g>
  <!-- 4 -->
  <g transform="translate(620 100)">
    <rect width="174" height="268" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="28" cy="30" r="14" fill="#2563EB"/><text x="28" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="50" y="35" font-size="12" font-weight="700" fill="#4E5968">고객 · 판매 채널</text>
    <text x="16" y="74" font-size="16" font-weight="700" fill="#191F28">적합성 확인과 청약</text>
    <text x="16" y="100" font-size="13" fill="#4E5968">적합성을 확인하고</text>
    <text x="16" y="119" font-size="13" fill="#4E5968">설명 카드 5장을 본다</text>
    <text x="16" y="138" font-size="13" fill="#4E5968">필요하면 추가 위험</text>
    <text x="16" y="157" font-size="13" fill="#4E5968">확인과 녹취(모의)를</text>
    <text x="16" y="176" font-size="13" fill="#4E5968">더해 청약한다</text>
    <text x="16" y="200" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#8B95A1">subscribe</text>
    <rect x="16" y="230" width="80" height="26" rx="13" fill="#EEF4FF"/><text x="56" y="247" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">원장 거래</text>
  </g>
  <!-- 5 -->
  <g transform="translate(814 100)">
    <rect width="174" height="268" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="28" cy="30" r="14" fill="#2563EB"/><text x="28" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="50" y="35" font-size="12" font-weight="700" fill="#4E5968">고객 · 판매 채널</text>
    <text x="16" y="74" font-size="16" font-weight="700" fill="#191F28">숙려와 최종 확인</text>
    <text x="16" y="100" font-size="13" fill="#4E5968">숙려 60초(시연) 뒤</text>
    <text x="16" y="119" font-size="13" fill="#4E5968">고객이 다시 확인한다</text>
    <text x="16" y="138" font-size="13" fill="#4E5968">원장이 가입을 확정하고</text>
    <text x="16" y="157" font-size="13" fill="#4E5968">증명서가 나온다</text>
    <text x="16" y="176" font-size="13" fill="#4E5968">숙려 전 확인은 거절한다</text>
    <text x="16" y="200" font-size="11" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#8B95A1">confirm</text>
    <rect x="16" y="230" width="80" height="26" rx="13" fill="#EEF4FF"/><text x="56" y="247" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">원장 거래</text>
  </g>
  <!-- 6 -->
  <g transform="translate(1008 100)">
    <rect width="174" height="268" rx="14" fill="#FFFFFF" stroke="#116149" stroke-width="1.4"/>
    <circle cx="28" cy="30" r="14" fill="#116149"/><text x="28" y="35" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="50" y="35" font-size="12" font-weight="700" fill="#4E5968">감독기관</text>
    <text x="16" y="74" font-size="16" font-weight="700" fill="#191F28">독립 검증</text>
    <text x="16" y="100" font-size="13" fill="#4E5968">판매사 API 없이</text>
    <text x="16" y="119" font-size="13" fill="#4E5968">RPC로 단계별 기록을</text>
    <text x="16" y="138" font-size="13" fill="#4E5968">대조한다</text>
    <text x="16" y="157" font-size="13" fill="#4E5968">기준·상품을 감사하고</text>
    <text x="16" y="176" font-size="13" fill="#4E5968">위험 신호를 본다</text>
    <rect x="16" y="230" width="80" height="26" rx="13" fill="#EAF6EF"/><text x="56" y="247" font-size="12" font-weight="700" fill="#116149" text-anchor="middle">RPC 조회</text>
  </g>

  <!-- 단계 사이 화살표 -->
  <path d="M212 234 H230" stroke="#8B95A1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M406 234 H424" stroke="#8B95A1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600 234 H618" stroke="#8B95A1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M794 234 H812" stroke="#8B95A1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M988 234 H1006" stroke="#8B95A1" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 원장 -->
  <path d="M125 368 V404" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <path d="M319 368 V404" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <path d="M707 368 V404" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <path d="M901 368 V404" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <path d="M1095 406 V370" stroke="#116149" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="133" y="391" font-size="11" fill="#2563EB">기록</text>
  <text x="327" y="391" font-size="11" fill="#2563EB">회차마다 기록</text>
  <text x="715" y="391" font-size="11" fill="#2563EB">기록</text>
  <text x="909" y="391" font-size="11" fill="#2563EB">기록</text>
  <text x="1103" y="391" font-size="11" fill="#116149">조회</text>

  <rect x="38" y="406" width="1144" height="52" rx="12" fill="#EEF4FF" stroke="#C7D7FE"/>
  <text x="58" y="438" font-size="15" font-weight="700" fill="#1D4ED8">원장 · Sepolia (로컬은 Anvil)</text>
  <text x="300" y="438" font-size="13" fill="#4E5968">FundLedger v5 + Groth16Verifier — 회차 순서, 증명, 적합성·승인·녹취·숙려 조건을 원장이 최종 판정한다</text>

  <text x="38" y="494" font-size="13" fill="#4E5968">기록한 회차는 판매사도 바꾸거나 지울 수 없다. 원본을 바꾸면 대조에서 불일치가 드러난다.</text>
</svg>
