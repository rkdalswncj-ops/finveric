<!--
Throwaway UI prototype. Question: can investors identify a fund's manager/seller,
and can operators follow the same sale through review and verification?
Three discovery layouts on this route: ?variant=A (cards), B (comparison), C (detail).
Design: DESIGN.md's fixed light theme. #FAFAFA background, #FFFFFF surface,
#191F28 text, #4E5968 secondary, #E5E8EB borders, #2563EB action.
Type: Korean system sans for product UI; system monospace for identifiers.
Layout: 216px role sidebar, quiet header, wide discovery/workbench, narrow questions.
Static HTML mirrors the selected component patterns; no shadcn package is imported.
All proofs, roles, transactions and purchases are simulations. No network calls.

<body>
<div class="shell">
 <aside class="sidebar" aria-label="주 메뉴">

  <div class="sidebar-foot"><strong>핀베릭 · 펀드 판매절차 공동 검증</strong>화면 시안 · 모든 데이터와 처리 모의<br>실제 투자·거래 기능은 없어요.</div>
 </aside>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',briefcase:'M3 7h18v13H3z M8 7V4h8v3 M3 12h18 M10 12v3h4v-3',file:'M5 3h9l5 5v13H5z M14 3v6h5 M8 13h8 M8 17h6',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',check:'M5 12l4 4L19 6',arrow:'M5 12h14 M14 7l5 5-5 5',left:'M14 6l-6 6 6 6',right:'M10 6l6 6-6 6',search:'M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15 M16 16l5 5',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 6v6l4 2',layers:'M12 3L2 8l10 5 10-5z M2 12l10 5 10-5 M2 16l10 5 10-5',chart:'M4 19V5 M4 19h16 M8 15l4-5 4 2 4-7',bank:'M3 9l9-6 9 6z M5 10v8 M10 10v8 M14 10v8 M19 10v8 M3 21h18',activity:'M3 12h4l3-8 4 16 3-8h4',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',upload:'M12 17V5 M7 10l5-5 5 5 M4 17v4h16v-4',info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20 M12 11v6 M12 7v.1',alert:'M12 3L2 21h20z M12 9v5 M12 17v.1',chevron:'M6 9l6 6 6-6',close:'M6 6l12 12 M18 6L6 18',copy:'M8 8h12v13H8z M16 8V3H3v13h5',dots:'M5 12h.1 M12 12h.1 M19 12h.1'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.file}"></path></svg>`;
const badge=(s,c='')=>`<span class="badge ${c}">${esc(s)}</span>`;
const btn=(s,action,cls='',attrs='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${s}</button>`;
const navigation=[['funds','펀드 찾기','grid'],['apply','가입하기','briefcase'],['records','내 가입 기록','file'],['manager','상품·문서 관리','bank'],['review','판매·검토 현황','layers'],['chain','온체인 처리','activity'],['verify','독립 검증','shield']];
let route=location.hash.slice(1)||'funds';
let variant=['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
let category='전체',query='',formStep=0,answers={amount:1050000,loss:null,experience:null,risk:null},selectedLog=0,verifyMode='original',customEvidence=null,busy=false,toastTimer;
const fund={name:'균형성장 글로벌 펀드',manager:'데모자산운용',seller:'데모증권',risk:'3등급 · 다소 높은 위험',fee:'0.68',class:'온라인 Ce',version:'v1',strategy:'글로벌 주식 60%와 채권 40%에 분산 투자해요.'};
const fundList=[{id:'main',name:fund.name,type:'주식혼합',risk:fund.risk,fee:'0.68',min:'10만원',strategy:fund.strategy,manager:fund.manager,color:'',icon:'chart',active:true},{id:'bond',name:'단기채권 안정추구 펀드',type:'채권',risk:'5등급 · 낮은 위험',fee:'0.24',min:'10만원',strategy:'단기 우량채권을 중심으로 운용하는 가상 상품이에요.',manager:fund.manager,color:'green',icon:'bank',active:false},{id:'growth',name:'글로벌 혁신기업 펀드',type:'주식',risk:'2등급 · 높은 위험',fee:'0.92',min:'10만원',strategy:'글로벌 기술·성장 기업에 투자하는 가상 상품이에요.',manager:fund.manager,color:'purple',icon:'layers',active:false}];
let sale={id:'FV-20261108-001',amount:1050000,attempts:[{round:1,passed:false,time:'10:21:06'},{round:2,passed:false,time:'10:23:14'},{round:3,passed:true,time:'10:25:32'}],docs:true,signed:true,approved:false,verified:false,purchased:false};
const initialLogs=[['10:20:14','상품·문서 v1 등록','운용사 · 모의','완료','green'],['10:21:06','진단 1회차 결과 기록','시안 원장 · 조건 미충족','완료','green'],['10:23:14','진단 2회차 결과 기록','시안 원장 · 조건 미충족','완료','green'],['10:25:32','진단 3회차 결과 기록','시안 원장 · 조건 충족','완료','green'],['10:25:33','추가 검토 필요','시안 규칙 · 진단 3회','대기','amber'],['10:26:10','설명 확인·모의 서명 기록','판매사 · 모의','완료','green']];
let logs=initialLogs.map((l,i)=>({time:l[0],title:l[1],source:l[2],status:l[3],color:l[4],ref:`DEMO-TX-${String(i+1).padStart(4,'0')}`}));
const status=()=>sale.verified?'가입 조건 검증 완료':sale.attempts.length>=3&&!sale.approved?'추가 검토 필요':'진행 중';
const statusColor=()=>sale.verified?'green':sale.attempts.length>=3&&!sale.approved?'amber':'blue';
const heading=(title,sub,action='',eyebrow='')=>`<div class="pagehead"><div>${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:''}<h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`;
const notice=(text,color='',name='info')=>`<div class="notice ${color}">${icon(name)}<p>${text}</p></div>`;
function renderNav(){ $('.switcher').hidden=route!=='funds';$('#brandIcon').innerHTML=icon('layers');$('#userNav').innerHTML='<div class="nav-label">사용자</div>'+navigation.slice(0,3).map(navItem).join('');$('#adminNav').innerHTML='<div class="nav-label">관리자</div>'+navigation.slice(3).map(navItem).join(''); const selected=navigation.find(x=>x[0]===route)||['detail','상품 상세'];$('#routeLabel').textContent=selected[1];$('#roleLabel').textContent=['manager','review','chain','verify'].includes(route)?'관리자':'사용자';$('#roleAvatar').textContent={manager:'운용',review:'판매',chain:'처리',verify:'검증'}[route]||'고객';$('#variantLabel').textContent=`${variant} · ${{A:'상품 카드',B:'비교 목록',C:'상품 집중'}[variant]}`;$('.switcher [data-action="variant-prev"]').innerHTML=icon('left');$('.switcher [data-action="variant-next"]').innerHTML=icon('right');}
function navItem([key,label,ic]){return `<button class="nav-item" type="button" data-nav="${key}" ${route===key||(route==='detail'&&key==='funds')?'aria-current="page"':''}>${icon(ic)}${label}</button>`}
function go(next){if(route!==next){route=next;history.replaceState(null,'',location.pathname+location.search+'#'+next)}render();window.scrollTo(0,0)}
function render(){renderNav();const views={funds:renderFunds,detail:renderDetail,apply:renderApply,records:renderRecords,manager:renderManager,review:renderReview,chain:renderChain,verify:renderVerify};$('#main').innerHTML=(views[route]||renderFunds)();if(route==='verify')updateVerification();}
function fundCard(f){return `<article class="fund-card"><div class="fund-card-head"><div class="fund-symbol ${f.color}">${icon(f.icon)}</div>${badge(f.active?'가입 절차 체험':'둘러보기',f.active?'blue':'')}</div><div class="fund-type">${f.type} · 온라인 클래스</div><h2>${f.name}</h2><p class="fund-strategy">${f.strategy}</p><dl class="fund-parties"><div><dt>운용</dt><dd>${f.manager}</dd></div><div><dt>판매</dt><dd>${fund.seller}</dd></div></dl><div class="fund-numbers"><div><span>총 보수 · 연</span><strong>${f.fee}<small>%</small></strong></div><div><span>투자 위험</span><strong>${f.risk.split(' · ')[0]}<small> / 6</small></strong></div></div>${btn(f.active?'상품 살펴보기 '+icon('arrow'):'예시 상품 정보',f.active?'open-fund':'sample-fund',f.active?'primary':'',`data-fund="${f.id}"`)}</article>`}
function renderFunds(){const funds=fundList.filter(f=>(category==='전체'||f.type===category)&&(!query||f.name.includes(query)||f.manager.includes(query)));const tools=`<div class="discovery-tools"><div class="chips">${['전체','주식혼합','채권','주식'].map(c=>`<button class="chip ${category===c?'active':''}" data-category="${c}" type="button">${c}</button>`).join('')}</div><div class="search">${icon('search')}<input class="input" id="fundSearch" placeholder="펀드명·운용사 검색" aria-label="펀드명 또는 운용사 검색" value="${esc(query)}"></div></div>`;let body='';if(variant==='A'){body=`<div class="catalog">${funds.map(fundCard).join('')||'<p class="empty">검색 결과가 없어요.</p>'}</div>`}else if(variant==='B'){body=`<div class="panel table-wrap"><table class="table"><thead><tr><th>상품 · 운용사</th><th>판매사</th><th>위험등급</th><th>총 보수 · 연</th><th>클래스</th><th></th></tr></thead><tbody>${funds.map(f=>`<tr><td><div class="row"><div class="fund-symbol ${f.color}">${icon(f.icon)}</div><div><div class="name">${f.name}</div><div class="sub">${f.manager} · ${f.type}</div></div></div></td><td>${fund.seller}</td><td>${badge(f.risk.split(' · ')[0],f.active?'amber':'')}</td><td>${f.fee}%</td><td>온라인 Ce</td><td>${btn(f.active?'살펴보기':'둘러보기',f.active?'open-fund':'sample-fund','',`data-fund="${f.id}"`)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">검색 결과가 없어요.</td></tr>'}</tbody></table></div>`}else{body=`<div class="hero-fund"><div><div class="row between"><div class="fund-symbol">${icon('chart')}</div>${badge('가입 절차 체험','blue')}</div><div class="fund-type" style="margin-top:25px">주식혼합 · 온라인 Ce</div><h2>${fund.name}</h2><p>${fund.strategy}</p><dl class="fund-parties"><div><dt>운용</dt><dd>${fund.manager}</dd></div><div><dt>판매</dt><dd>${fund.seller}</dd></div></dl></div><div class="stack"><h3>상품을 먼저 확인해 보세요</h3><dl class="facts"><div><dt>위험등급</dt><dd>3등급 · 다소 높은 위험</dd></div><div><dt>총 보수 · 연</dt><dd>0.68%</dd></div><div><dt>투자 전략</dt><dd>글로벌 분산 투자</dd></div><div><dt>설명서</dt><dd>v1 · 시연용</dd></div></dl>${notice('원금 손실이 생길 수 있어요. 상품 설명과 투자 위험을 먼저 확인해 주세요.','amber','alert')}${btn('상품 살펴보기 '+icon('arrow'),'open-fund','primary large')}</div></div><div class="mini-funds">${fundList.slice(1).map(f=>`<div class="mini-fund"><div class="fund-symbol ${f.color}">${icon(f.icon)}</div><div><h3>${f.name}</h3><span class="quiet">${f.manager} · 둘러보기 전용</span></div></div>`).join('')}</div>`}
return heading('어떤 펀드로 시작할까요?','누가 운용하고 판매하는지, 위험과 비용까지 함께 확인해 보세요.','','펀드 찾기')+tools+body+`<div class="catalog-note"><span>모든 상품명·위험·보수는 화면 시안을 위한 가상 정보예요.</span><span>체험 가능한 상품 1개 · 예시 상품 2개</span></div><div class="help-strip"><div class="row"><div class="fund-symbol">${icon('shield')}</div><div><h3>가입할 때 확인한 내용, 내 기록으로 남겨요</h3><p>진단부터 설명 확인까지, 같은 기록으로 가입 과정을 살펴볼 수 있어요.</p></div></div>${btn('내 가입 기록 보기 '+icon('arrow'),'go-records')}</div>`}
function summaryBox(){return `<aside class="panel panel-pad summary-box"><span class="eyebrow">가입 전 확인</span><h2>${fund.name}</h2><dl class="facts"><div><dt>운용사</dt><dd>${fund.manager}</dd></div><div><dt>판매사</dt><dd>${fund.seller}</dd></div><div><dt>클래스</dt><dd>${fund.class}</dd></div><div><dt>총 보수 · 연</dt><dd>0.68%</dd></div><div><dt>문서 버전</dt><dd>v1</dd></div></dl>${btn('가입 절차 시작하기','start-apply','primary full large')}<p class="quiet">실제 투자나 결제가 없는 화면 체험이에요.</p></aside>`}
function renderDetail(){return heading('상품을 자세히 알아보세요','전략과 비용, 투자 위험을 확인한 뒤 가입할 수 있어요.',btn(icon('left')+' 펀드 목록','go-funds'))+`<div class="detail-grid"><div class="stack"><section class="panel panel-pad"><div class="detail-title"><div class="fund-symbol">${icon('chart')}</div><div><div class="fund-type">주식혼합 · 온라인 Ce</div><h1>${fund.name}</h1></div></div><div style="margin-top:23px">${notice('원금 손실 가능 · 3등급, 다소 높은 위험의 가상 상품이에요.','amber','alert')}</div><div class="section-title"><h2>한쪽에 치우치지 않는 분산 투자</h2></div><p class="muted small">글로벌 주식과 채권에 나누어 투자해요. 시장 상황에 따라 투자 자산의 가치가 달라질 수 있어요.</p><div class="allocation" aria-label="가상 투자 비중: 주식 60%, 채권 40%"><span></span><span></span></div><div class="row between small"><span>글로벌 주식 <strong>60%</strong></span><span class="muted">채권 <strong>40%</strong></span></div></section><section class="panel panel-pad"><h2>가입 전에 확인할 정보</h2><dl class="facts" style="margin-top:15px"><div><dt>운용 · 판매</dt><dd>${fund.manager} · ${fund.seller}</dd></div><div><dt>총 보수 · 연</dt><dd>0.68% · 가상 수치</dd></div><div><dt>매입 시 공제 비용</dt><dd>시연에서는 0원</dd></div><div><dt>매입 가격과 시점</dt><dd>모의 매입 결과에서 확인</dd></div></dl></section><section class="panel panel-pad"><div class="row between"><h2>상품 문서</h2>${badge('운용사 등록 · v1','blue')}</div>${['간이투자설명서','투자설명서','핵심 투자 위험 안내'].map(t=>`<div class="doc-row"><div class="row">${icon('file')}<span>${t}</span></div>${btn('내용 보기','show-doc','text',`data-doc="${t}"`)}</div>`).join('')}</section></div>${summaryBox()}</div>`}
function formSide(){return `<aside class="stack"><div class="panel form-side"><div class="fund-type">가입 중인 상품</div><div class="fund-name">${fund.name}</div><dl class="facts"><div><dt>운용사</dt><dd>${fund.manager}</dd></div><div><dt>판매사</dt><dd>${fund.seller}</dd></div><div><dt>가입 금액</dt><dd>${Number(answers.amount).toLocaleString()}원</dd></div></dl></div><div class="panel form-side"><h3>같은 판매 건의 진단 기록</h3>${sale.attempts.map(a=>`<div class="attempt-row"><span>${a.round}회차</span>${badge(a.passed?'조건 충족':'조건 미충족',a.passed?'green':'')}</div>`).join('')}<p class="quiet" style="margin-top:14px">답변을 정정하면 이전 기록은 보존하고 새 회차로 남겨요.</p></div></aside>`}
function renderApply(){const steps=['금액 확인','진단','설명 확인','답변·서명'];let content='';let progress=formStep===0?0:formStep<=3||formStep===7?1:formStep===4?2:3;if(formStep===0){content=`<span class="eyebrow">가입 금액</span><h2>얼마를 투자할까요?</h2><p class="intro">실제 출금 없이 가입 과정을 체험해요.</p><div class="field"><label for="amount">가입 금액</label><div class="amount-wrap"><input id="amount" class="input amount-input" type="number" min="100000" step="10000" value="${answers.amount}"><span>원</span></div></div><div class="amount-options">${[500000,1050000,2000000].map(a=>`<button type="button" data-amount="${a}">${(a/10000).toLocaleString()}만원</button>`).join('')}</div><div style="margin-top:25px">${notice('매입 가격과 좌수는 매입 결과를 받은 뒤 별도로 확인해요.')}</div><div class="form-actions">${btn('진단 시작하기 '+icon('arrow'),'form-next','primary large')}</div>`}else if(formStep===1||formStep===2||formStep===3){const name=formStep===1?'loss':formStep===2?'experience':'risk';const title={loss:'투자 손실을 어느 정도<br>감당할 수 있나요?',experience:'어떤 투자 경험이 있나요?',risk:'원금 손실이 생길 수 있다는<br>점을 확인했나요?'}[name];const labels={loss:['손실을 감당하기 어려워요','일부 손실은 감당할 수 있어요','큰 손실도 감당할 수 있어요'],experience:['투자 경험이 없어요','펀드에 투자한 경험이 있어요','여러 위험자산에 투자한 경험이 있어요'],risk:['네, 원금 손실 가능성을 확인했어요','아니요, 아직 확인하지 못했어요']}[name];content=`<span class="eyebrow">진단 ${formStep} / 3</span><h2>${title}</h2><p class="intro">본인의 상황에 맞는 답변을 골라 주세요.</p><fieldset class="choice-group"><legend class="sr-only">${title.replace('<br>',' ')}</legend>${labels.map((label,i)=>`<label class="choice"><input type="radio" name="${name}" value="${i}" ${answers[name]===i?'checked':''}>${label}</label>`).join('')}</fieldset><div class="form-actions">${btn('이전','form-back','large')}${btn(formStep===3?'답변 확인하기':'다음','form-next','primary large')}</div>`}else if(formStep===4){content=`<span class="eyebrow">설명 확인</span><h2>핵심 내용을 하나씩<br>확인해 주세요</h2><p class="intro">운용사가 등록한 설명서 v1의 가상 내용이에요.</p>${[['doc-risk','원금 손실 가능성','투자 자산의 가치 하락으로 원금 손실이 발생할 수 있어요.'],['doc-fee','비용과 보수','총 보수는 연 0.68%인 가상 상품이에요.'],['doc-price','매입과 환매 시점','가격 적용일과 환매 일정은 상품 문서에 따라 달라져요.']].map(([id,title,text])=>`<label class="checkline"><input type="checkbox" id="${id}" ${sale.docs?'checked':''}><div><strong>${title}</strong><span>${text}</span></div></label>`).join('')}<div class="form-actions">${btn('이전','form-back','large')}${btn('최종 답변 확인하기','form-next','primary large')}</div>`}else if(formStep===5){content=`<span class="eyebrow">최종 확인</span><h2>확인한 내용으로<br>가입 절차를 요청할까요?</h2><p class="intro">확인한 진단 회차와 문서를 같은 가입 건에 연결해요.</p><dl class="facts"><div><dt>상품</dt><dd>${fund.name}</dd></div><div><dt>가입 금액</dt><dd>${Number(answers.amount).toLocaleString()}원</dd></div><div><dt>설명서</dt><dd>v1 · 시연용</dd></div><div><dt>현재 진단 회차</dt><dd>${sale.attempts.length}회차</dd></div></dl><label class="checkline"><input type="checkbox" id="mockSign"><div><strong>답변과 설명서를 확인했어요</strong><span>실제 전자서명이 아닌 모의 서명으로 요청해요.</span></div></label><div class="form-actions">${btn('이전','form-back','large')}${btn('모의 서명하고 요청하기','submit-application','primary large')}</div>`}else{content=`<div class="result-icon amber">${icon('clock')}</div><span class="eyebrow">판매 ID · ${sale.id}</span><h2>${sale.attempts.at(-1)?.passed?(sale.attempts.length>=3?'추가 검토를 기다리고 있어요':'가입 요청을 받았어요'):'시연 가입 기준에 맞지 않아요'}</h2><p class="intro">${sale.attempts.at(-1)?.passed?(sale.attempts.length>=3?'이전 진단과 이번 답변을 담당자가 함께 확인해요. 검토 결과는 내 가입 기록에서 볼 수 있어요.':'필수 확인 기록을 검토하고 있어요. 처리 결과는 내 가입 기록에서 볼 수 있어요.'):'확인한 답변과 결과는 기록에 남아요. 이 화면의 기준은 실제 금융상품의 가입 기준이 아닌 시연 규칙이에요.'}</p>${notice('가입 조건 검증과 실제 매입 결과는 서로 다른 상태예요.')}<div class="form-actions">${btn('내 가입 기록 보기','go-records','primary large')}${formStep===7?btn('답변 정정하기','correct-answers','large'):''}</div>`}
return heading('상품 가입을 준비해요','본인의 답변과 확인한 문서로 가입 과정을 남겨요.')+`<div class="form-layout"><section class="panel form-panel"><div class="row between small muted" style="margin-bottom:14px"><span>${steps[progress]}</span><span>${progress+1} / 4</span></div><div class="progress">${steps.map((_,i)=>`<span class="${i<=progress?'active':''}"></span>`).join('')}</div>${content}</section>${formSide()}</div>`}
function timeline(){return `<ol class="timeline">${sale.attempts.map(a=>`<li><span class="timeline-mark done">✓</span><div><span class="time">${a.time}</span><strong>진단 ${a.round}회차 · ${a.passed?'조건 충족':'조건 미충족'}</strong><p>답변 원문과 총점은 공개하지 않아요.</p></div></li>`).join('')}<li><span class="timeline-mark ${sale.docs?'done':''}">${sale.docs?'✓':'·'}</span><div><strong>핵심 설명 확인 · 문서 v1</strong><p>${sale.docs?'세 항목의 확인 기록이 있어요.':'설명 확인이 필요해요.'}</p></div></li><li><span class="timeline-mark ${sale.signed?'done':''}">${sale.signed?'✓':'·'}</span><div><strong>최종 답변·모의 서명</strong><p>${sale.signed?'같은 판매 건의 확인 기록이 있어요.':'모의 서명 확인이 필요해요.'}</p></div></li><li><span class="timeline-mark ${sale.approved?'done':'warn'}">${sale.approved?'✓':'!'}</span><div><strong>추가 검토 ${sale.approved?'승인':'대기'}</strong><p>반복 진단의 이력과 필수 기록을 확인해요.</p></div></li><li><span class="timeline-mark ${sale.verified?'done':''}">${sale.verified?'✓':'·'}</span><div><strong>가입 조건 검증 ${sale.verified?'완료':'대기'}</strong><p>시안 원장의 처리 상태예요.</p></div></li></ol>`}
function renderRecords(){return heading('내 가입 기록','가입할 때 확인한 내용과 현재 처리 상태를 함께 볼 수 있어요.',btn(icon('download')+' 증빙 내려받기','download'))+`<div class="detail-grid"><div class="stack"><section class="panel panel-pad"><div class="row between wrap"><span class="eyebrow">${sale.id}</span>${badge(status(),statusColor())}</div><h2 style="font-size:24px;margin:16px 0 8px">${fund.name}</h2><p class="quiet">${fund.manager} 운용 · ${fund.seller} 판매</p><dl class="facts" style="margin-top:20px"><div><dt>가입 요청 금액</dt><dd>${Number(sale.amount).toLocaleString()}원</dd></div><div><dt>판매 절차</dt><dd>${status()}</dd></div><div><dt>매입 상태</dt><dd>${sale.purchased?'매입 결과 반영 · 모의':'아직 매입하지 않았어요'}</dd></div>${sale.purchased?`<div><dt>모의 매입 결과</dt><dd>${(sale.amount/1050*1000).toLocaleString('ko-KR',{maximumFractionDigits:2})}좌 · 1,000좌당 1,050원</dd></div>`:''}</dl></section><section class="panel panel-pad"><div class="section-title" style="margin-top:0"><h2>가입 과정 타임라인</h2><span class="quiet">시안 예시 기록</span></div>${timeline()}</section></div><aside class="stack"><section class="panel panel-pad"><div class="fund-symbol">${icon('shield')}</div><h2 style="margin:17px 0 9px">내 기록을 직접 확인해요</h2><p class="small muted">내려받은 증빙과 등록된 기록이 같은지 항목별로 확인할 수 있어요.</p><div style="margin-top:20px">${btn('독립 검증 화면 열기','go-verify','soft full')}</div></section>${notice('이번 화면의 원장·서명·매입은 모두 모의 처리예요.','blue')}</aside></div>`}
function renderManager(){return heading('상품과 문서 버전을 관리하세요','고객이 어떤 상품과 설명서를 확인했는지 연결합니다.',btn('등록 내용 확인','show-product','primary'),'운용사 · 데모자산운용')+`<div class="metrics"><div class="metric"><span>등록 상품</span><strong>1</strong><small>가상 온라인 클래스 1개</small></div><div class="metric"><span>현재 설명서</span><strong>v1</strong><small>시연 버전</small></div><div class="metric"><span>연결 판매사</span><strong>1</strong><small>데모증권</small></div><div class="metric"><span>적용 중 판매 건</span><strong>1</strong><small>답변 원문은 공유하지 않음</small></div></div><div class="panel"><div class="panel-heading"><h2>상품·문서 목록</h2>${badge('상품 조건과 판매사 진단 규칙 구분','blue')}</div><div class="table-wrap"><table class="table"><thead><tr><th>상품명 · 클래스</th><th>상품 문서</th><th>판매사</th><th>판매사 진단 규칙</th><th>상태</th></tr></thead><tbody><tr><td><div class="name">${fund.name}</div><div class="sub">FUND-DEMO-001 · 온라인 Ce</div></td><td>v1 · 2026.11.08</td><td>${fund.seller}</td><td>진단 v1</td><td>${badge('사용 중','green')}</td></tr></tbody></table></div></div><div class="detail-grid" style="margin-top:23px"><section class="panel panel-pad"><h2>이 버전에 연결된 문서</h2>${['간이투자설명서','투자설명서','핵심 투자 위험 안내'].map(t=>`<div class="doc-row"><span>${t}</span>${btn('v1 내용 보기','show-doc','text',`data-doc="${t}"`)}</div>`).join('')}</section><section class="panel panel-pad"><h3>서로 다른 기관의 책임</h3><p class="small muted" style="margin-top:13px">운용사는 상품·설명서를 등록합니다. 증권사는 고객 진단과 판매 절차를 관리합니다.</p><div style="margin-top:18px">${notice('이 화면은 실제 운용사 시스템과 연결되지 않았습니다.')}</div></section></div>`}
function renderReview(){return heading('검토가 필요한 판매 건을 확인하세요','이전 진단과 필수 확인 기록을 같은 판매 ID로 살펴봅니다.',btn('처리 화면 열기 '+icon('arrow'),'go-chain'),'판매사 · 데모증권')+`<div class="metrics"><div class="metric"><span>전체 판매 건</span><strong>1</strong><small>가상 고객 1명</small></div><div class="metric ${!sale.approved?'attention':''}"><span>추가 검토 대기</span><strong>${sale.approved?0:1}</strong><small>진단 3회 이상</small></div><div class="metric"><span>가입 조건 검증 완료</span><strong>${sale.verified?1:0}</strong><small>실제 매입과 구분</small></div><div class="metric"><span>필수 기록 누락</span><strong>${!sale.docs||!sale.signed?1:0}</strong><small>설명 확인·모의 서명</small></div></div><div class="work-grid"><div class="stack"><div class="panel"><div class="panel-heading"><h2>판매 건</h2><span class="quiet">시안 예시 1건</span></div><div class="table-wrap"><table class="table"><thead><tr><th>판매 ID · 상품</th><th>상태</th><th>진단</th></tr></thead><tbody><tr class="selected"><td><div class="name mono">${sale.id}</div><div class="sub">${fund.name}</div></td><td>${badge(status(),statusColor())}</td><td>${sale.attempts.length}회</td></tr></tbody></table></div></div><section class="panel panel-pad"><div class="row between"><h2>검토할 사항</h2>${badge('답변 원문·총점 비공개')}</div><div style="margin-top:20px">${notice('동일 판매 세션에서 진단을 세 번 진행했습니다. 앞선 두 회차는 미충족, 마지막 회차는 충족입니다.','amber','alert')}</div><dl class="facts" style="margin-top:15px"><div><dt>설명서 버전</dt><dd>v1 · 일치</dd></div><div><dt>핵심 설명 확인</dt><dd>${sale.docs?'3개 항목 완료':'확인 필요'}</dd></div><div><dt>모의 서명</dt><dd>${sale.signed?'확인됨':'누락'}</dd></div><div><dt>최종 진단 결과</dt><dd>${sale.attempts.at(-1)?.passed?'조건 충족':'조건 미충족'}</dd></div></dl><div class="review-note"><strong>추가 검토의 범위</strong>검토 승인은 필수 기록과 진단 결과를 대신하지 않습니다. 처리 화면에서 모든 조건을 별도로 확인합니다.</div><div class="row wrap">${btn(sale.approved?'검토 승인됨':'이력을 확인하고 검토 승인','approve','primary',sale.approved?'disabled':'')}${btn('고객 기록 보기','go-records')}</div></section></div><aside class="panel case-summary"><span class="eyebrow">선택한 판매 건</span><h2>가입 과정</h2><p class="quiet" style="margin-bottom:24px">${sale.id}</p>${timeline()}</aside></div>`}

function renderVerify(){const bad=verifyMode==='modified';return heading('같은 기록인지 직접 확인하세요','고객이 가진 파일을 판매사 조회 API 없이 대조하는 화면입니다.','','독립 검증')+`<div style="margin-bottom:21px">${notice('독립 검증의 UI 시안입니다. 실제 RPC·ZKP 검증은 연결하지 않았습니다. 파일의 SHA-256 지문은 이 브라우저에서 계산합니다.','blue')}</div><div class="verify-layout"><aside class="panel panel-pad stack"><h2>검증할 기록</h2><div class="field"><label for="verifyId">판매 ID</label><input class="input mono" id="verifyId" value="${sale.id}"></div>${btn('기록 조회하기','lookup','primary full')}<div class="upload-box">${icon('upload')}<strong>고객 증빙 파일 열기</strong><p>이 시안에서 내려받은 JSON을 선택하세요.</p><input type="file" id="evidenceFile" class="file-input" accept="application/json,.json" aria-label="고객 증빙 JSON 파일 선택"></div><div><p class="small muted" style="margin-bottom:11px">예시 파일로 비교해 보세요</p><div class="row wrap">${btn('원래 파일','verify-original',verifyMode==='original'?'soft':'')}${btn('수정한 사본','verify-modified',bad?'soft':'')}</div></div><p class="quiet">파일은 외부 서버로 전송하지 않습니다. 이 시안의 판매 건만 대조할 수 있습니다.</p></aside><div class="stack"><section class="panel panel-pad"><div class="verify-title"><div class="result-icon ${bad?'amber':''}">${icon(bad?'alert':'shield')}</div><div><h2 id="verificationTitle">${bad?'원본 불일치를 발견했어요':'항목별 확인 결과'}</h2><p class="quiet">${sale.id} · ${bad?'수정한 사본':'고객 원본 예시'}</p></div></div><div id="fingerprintStatus" class="quiet" style="margin-bottom:15px">파일 지문 계산 중…</div><div id="checks">${evidenceChecks(bad).map(([title,desc,ok])=>`<div class="check-result ${ok?'':'bad'}">${icon(ok?'check':'alert')}<div><strong>${title}</strong><p>${desc}</p></div>${badge(ok?'일치·확인':'확인 필요',ok?'green':'amber')}</div>`).join('')}</div></section><section class="panel panel-pad"><div class="row between"><h2>대조 기준과 원장 근거</h2>${badge('시안 데이터')}</div><div style="margin-top:15px"><div class="evidence-line"><span>네트워크</span><code>Sepolia 연결 예정 · 현재 모의</code></div><div class="evidence-line"><span>원장</span><code>DEMO-LEDGER-001</code></div><div class="evidence-line async function fingerprint(obj){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(obj)));return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function updateVerification(){try{const originalHash=await fingerprint(originalEvidence);const copy=customEvidence||structuredClone(originalEvidence);if(verifyMode==='modified'&&!customEvidence)copy.answers[0].loss=2;const received=await fingerprint(copy);if(route!=='verify')return;$('#fingerprintStatus').textContent=received===originalHash?'SHA-256 지문 일치 · 브라우저에서 계산':'SHA-256 지문 불일치 · 원본과 내용이 달라요';$('#evidenceHash').textContent=received.slice(0,18)+'…'+received.slice(-12);$('#evidenceHash').title=received;if(customEvidence){const ok=received===originalHash;$('#verificationTitle').textContent=ok?'선택한 파일이 원본과 같아요':'선택한 파일이 원본과 달라요';$('#checks').innerHTML=evidenceChecks(!ok).map(([title,desc,pass])=>`<div class="check-result ${pass?'':'bad'}">${icon(pass?'check':'alert')}<div><strong>${title}</strong><p>${desc}</p></div>${badge(pass?'일치·확인':'확인 필요',pass?'green':'amber')}</div>`).join('')}}catch{$('#fingerprintStatus').textContent='지문 계산을 사용할 수 없습니다. localhost에서 열어 주세요.'}}

if(a==='download'){const blob=new Blob([JSON.stringify(originalEvidence,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='fund-demo-customer-evidence.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('고객 보관용 가상 원본을 내려받았어요.');return}
if(a==='verify-original'||a==='verify-modified'){customEvidence=null;verifyMode=a==='verify-original'?'original':'modified';render();return}if(a==='lookup'){if($('#verifyId').value.trim()!==sale.id){toast('이 시안에 등록되지 않은 판매 ID예요.');return}updateVerification();toast('시안 데이터에서 같은 판매 ID를 조회했어요.');return}
if(a==='show-doc'){modal(b.dataset.doc||'상품 문서',`<p><strong>${fund.name} · 문서 v1</strong></p><p style="margin-top:15px">화면 체험을 위한 가상 설명서예요. 원금 손실이 발생할 수 있고, 가격 적용일과 환매 일정은 상품 문서에 따라 달라져요. 총 보수는 연 0.68%인 시연 수치예요.</p><div style="margin-top:20px">${notice('실제 투자설명서가 아니에요.')}</div>`);return}if(a==='show-product'){modal('등록한 상품 정보',`<dl class="facts"><div><dt>상품</dt><dd>${fund.name}</dd></div><div><dt>운용사</dt><dd>${fund.manager}</dd></div><div><dt>설명서</dt><dd>v1</dd></div><div><dt>연결 판매사</dt><dd>${fund.seller}</dd></div></dl>`);return}if(a==='close-modal')$('#modalRoot').innerHTML='';
});
document.addEventListener('input',e=>{if(e.target.id==='fundSearch'){query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#fundSearch');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='evidenceFile'){const file=e.target.files[0];if(!file)return;if(file.size>200000){toast('200KB 이하의 시안 JSON 파일을 선택해 주세요.');return}try{customEvidence=JSON.parse(await file.text());verifyMode='custom';updateVerification();toast('파일을 브라우저 안에서 열었어요.')}catch{toast('이 시안에서 내려받은 JSON 파일인지 확인해 주세요.')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML='';if(route==='funds'&&['ArrowLeft','ArrowRight'].includes(e.key)&&!e.target.closest('input,textarea,select,[contenteditable]')){e.preventDefault();document.querySelector(`[data-action="variant-${e.key==='ArrowRight'?'next':'prev'}"]`).click()}});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'funds';render()});
render();
</script>
</body>
</html>
