name: MVP checks
# 지금은 push·PR에서 자동으로 돌리지 않는다. Actions 탭에서 수동으로만 실행한다.
# 다시 켤 때는 on에 push와 pull_request를 더한다.
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run zk:setup
      - run: npm run contracts:test
      - run: npm test
      - run: npm run build
